name: security-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      break_glass:
        description: "Set to 'true' only under docs/03-break-glass.md"
        required: false
        default: "false"
      break_glass_reason:
        description: "Incident ticket and one-line reason"
        required: false

permissions:
  contents: read

jobs:
  waivers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate waivers (build fails on expiry)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/waivers.py check
      - name: Generate per-tool ignore files
        run: python3 scripts/waivers.py generate
      - uses: actions/upload-artifact@v4
        with:
          name: waiver-ignores
          path: |
            .trivyignore
            .gitleaksignore
            semgrep-excludes.txt

  secret-scan:
    needs: waivers
    if: ${{ github.event.inputs.break_glass != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, not the diff
      - uses: actions/download-artifact@v4
        with: { name: waiver-ignores }
      - name: Gitleaks over full git history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  sca:
    needs: waivers
    if: ${{ github.event.inputs.break_glass != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: waiver-ignores }
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1

  sast:
    needs: waivers
    if: ${{ github.event.inputs.break_glass != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: waiver-ignores }
      - name: Semgrep (ERROR severity blocks)
        run: |
          pip install semgrep==1.90.0
          EXCLUDES=""
          while read -r rule; do
            [ -n "$rule" ] && EXCLUDES="$EXCLUDES --exclude-rule $rule"
          done < semgrep-excludes.txt
          semgrep scan --config p/security-audit --config p/owasp-top-ten \
            --severity ERROR --error $EXCLUDES .

  iac:
    needs: waivers
    if: ${{ github.event.inputs.break_glass != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: waiver-ignores }
      - name: Trivy IaC misconfig scan
        uses: aquasecurity/trivy-action@0.28.0
        env:
          TRIVY_SKIP_DIRS: policy/terraform-fixtures,policy/kyverno/tests # negative fixtures are supposed to fail
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          exit-code: 1
      - name: Conftest custom Terraform rules
        run: |
          curl -sSfL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar -xz conftest
          ./conftest verify --policy policy/rego
          ./conftest test --parser hcl2 --policy policy/rego terraform/ remediate/terraform/
          if ./conftest test --parser hcl2 --policy policy/rego policy/terraform-fixtures/bad.tf; then
            echo "::error::negative fixture passed — policy regression"; exit 1
          fi

  admission-policy-tests:
    needs: waivers
    if: ${{ github.event.inputs.break_glass != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kyverno policy tests
        run: |
          curl -sSfL https://github.com/kyverno/kyverno/releases/download/v1.13.2/kyverno-cli_v1.13.2_linux_x86_64.tar.gz | tar -xz kyverno
          ./kyverno test policy/kyverno/tests/

  break-glass-audit:
    if: ${{ github.event.inputs.break_glass == 'true' }}
    runs-on: ubuntu-latest
    environment: break-glass
    permissions:
      issues: write
    steps:
      - name: Refuse without a reason
        if: ${{ github.event.inputs.break_glass_reason == '' }}
        run: echo "break_glass requires break_glass_reason (incident ticket)"; exit 1
      - name: Leave the audit trail
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `BREAK-GLASS: gates bypassed by ${context.actor}`,
              labels: ['break-glass', 'security-debt'],
              body: [
                `**Actor:** ${context.actor}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Reason:** ${context.payload.inputs.break_glass_reason}`,
                `**SLA:** gates must pass on a follow-up run within 72h or this issue pages the platform team.`,
              ].join('\n')
            })
