name: build-release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io # production: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api (mapping in docs/02)
  IMAGE: ${{ github.repository }} # ghcr package named after the repo; prod image is ECR accounts-api

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
          flavor: latest=false

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: sigstore/cosign-installer@v3

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Sign image (keyless)
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Attest SBOM (keyless)
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json --type spdxjson \
            "${REGISTRY}/${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

  verify:
    needs: build-sign-attest
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify signature and SBOM attestation
        run: |
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/build-release\.yml@refs/(heads/main|tags/v.*)$" \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.build-sign-attest.outputs.digest }}"
          cosign verify-attestation --type spdxjson \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/build-release\.yml@refs/(heads/main|tags/v.*)$" \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.build-sign-attest.outputs.digest }}"

  deploy:
    needs: [build-sign-attest, verify]
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }} # stubbed per the brief; no real AWS org behind the role
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/accounts-api-deploy
          aws-region: ap-south-1
      - name: Deploy by digest
        run: |
          aws eks update-kubeconfig --name prod-cluster
          kubectl -n accounts set image deploy/accounts-api api=${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.build-sign-attest.outputs.digest }}
