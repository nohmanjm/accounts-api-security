name: build-release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io # production: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api (mapping in docs/02)
  IMAGE: ${{ github.repository }} # ghcr package named after the repo; prod image is ECR accounts-api

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
          flavor: latest=false

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: sigstore/cosign-installer@v3

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Sign image (keyless)
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Attest SBOM (keyless)
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json --type spdxjson \
            "${REGISTRY}/${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

  verify:
    needs: build-sign-attest
    runs-on: ubuntu-latest
    timeout-minutes: 12 # backstop; the per-call OS timeout below is the real bound
    permissions:
      packages: read
    steps:
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # cosign's own --timeout does not bound the TUF-root/network setup, so wrap each
      # call in an OS-level hard timeout and retry — keyless verification depends on
      # Sigstore's public infra (TUF, Fulcio, Rekor), which stalls transiently.
      - name: Verify signature and SBOM attestation
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.build-sign-attest.outputs.digest }}
          IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/build-release\.yml@refs/(heads/main|tags/v.*)$
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          timeout -k 10 60 cosign initialize || echo "::warning::cosign initialize timed out; verify will refetch"
          run_with_retry() {
            label="$1"; shift
            for attempt in 1 2 3; do
              if timeout -k 10 120 "$@"; then return 0; fi
              echo "::warning::${label} attempt ${attempt} timed out or failed; retrying"
              sleep 15
            done
            echo "::error::${label} failed after 3 attempts — release blocked"; return 1
          }
          run_with_retry "cosign verify" cosign verify \
            --certificate-oidc-issuer "$ISSUER" \
            --certificate-identity-regexp "$IDENTITY" "$IMAGE_REF"
          run_with_retry "cosign verify-attestation" cosign verify-attestation --type spdxjson \
            --certificate-oidc-issuer "$ISSUER" \
            --certificate-identity-regexp "$IDENTITY" "$IMAGE_REF"

  deploy:
    needs: [build-sign-attest, verify]
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }} # stubbed per the brief; no real AWS org behind the role
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/accounts-api-deploy
          aws-region: ap-south-1
      - name: Deploy by digest
        run: |
          aws eks update-kubeconfig --name prod-cluster
          kubectl -n accounts set image deploy/accounts-api api=${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.build-sign-attest.outputs.digest }}
