apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-namespaces
  annotations:
    policies.mal.bank/threat: "T2"
spec:
  validationFailureAction: Audit
  validationFailureActionOverrides:
    - action: Enforce
      namespaces: [accounts]
  background: true
  rules:
    - name: no-host-namespaces
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: >-
          Sharing the node's network/PID/IPC namespaces is forbidden: it bypasses
          NetworkPolicy and exposes node-local services to the workload.
        pattern:
          spec:
            =(hostNetwork): "false"
            =(hostPID): "false"
            =(hostIPC): "false"
