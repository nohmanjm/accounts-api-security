apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-secrets-from-env
  annotations:
    policies.mal.bank/threat: "T3"
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: no-secrets-in-env
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: >-
          Secret material must not enter the environment (envFrom.secretRef or
          env valueFrom.secretKeyRef, in any container including init) — values
          appear in /proc/<pid>/environ, crash dumps, and child processes.
          Mount the secret as a file instead.
        pattern:
          spec:
            =(ephemeralContainers):
              - name: "*"
                =(envFrom):
                  - X(secretRef): "null"
                =(env):
                  - =(valueFrom):
                      X(secretKeyRef): "null"
            =(initContainers):
              - name: "*"
                =(envFrom):
                  - X(secretRef): "null"
                =(env):
                  - =(valueFrom):
                      X(secretKeyRef): "null"
            containers:
              - name: "*"
                =(envFrom):
                  - X(secretRef): "null"
                =(env):
                  - =(valueFrom):
                      X(secretKeyRef): "null"
