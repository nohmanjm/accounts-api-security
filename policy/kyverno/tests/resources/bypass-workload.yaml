# Bypass attempts: violations moved into an initContainer, RoleBinding to cluster-admin, wildcard apiGroups
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-api-bypass
  namespace: accounts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts-api-bypass
  template:
    metadata:
      labels:
        app: accounts-api-bypass
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: setup
          image: docker.io/library/busybox:latest
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          envFrom:
            - secretRef:
                name: accounts-api-env
      containers:
        - name: api
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api@sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          securityContext:
            runAsNonRoot: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bypass-binding
  namespace: accounts
subjects:
  - kind: ServiceAccount
    name: default
    namespace: accounts
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: apigroups-wildcard
  namespace: accounts
rules:
  - apiGroups: ["*"]
    resources: ["configmaps"]
    verbs: ["get"]
