# Fixed workload plus a compliant scoped Role; positive fixture
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-api-fixed
  namespace: accounts
spec:
  replicas: 3
  selector:
    matchLabels:
      app: accounts-api
  template:
    metadata:
      labels:
        app: accounts-api
    spec:
      serviceAccountName: accounts-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api@sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: db-creds
              mountPath: /var/secrets/db
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: db-creds
          secret:
            secretName: accounts-api-db
        - name: tmp
          emptyDir: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-reader-fixed
  namespace: accounts
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["accounts-api-db"]
    verbs: ["get", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["accounts-api-config"]
    verbs: ["get"]
