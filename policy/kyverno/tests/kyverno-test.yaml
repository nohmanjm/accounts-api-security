    result: fail
  - policy: require-image-digest
    rule: autogen-require-digest
    kind: Deployment
    resources: [accounts/accounts-api-bypass]
    result: fail
  - policy: disallow-secrets-from-env
    rule: autogen-no-secrets-in-env
    kind: Deployment
    resources: [accounts/accounts-api-bypass]
    result: fail
  - policy: restrict-registries
    rule: autogen-accounts-ecr-only
