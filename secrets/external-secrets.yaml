# Delivery path and identity chain documented in docs/06-secrets-rotation.md
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: accounts
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso-accounts
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: accounts-api-db
  namespace: accounts
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: accounts-api-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: prod/accounts-api/db-app-user
        property: username
    - secretKey: password
      remoteRef:
        key: prod/accounts-api/db-app-user
        property: password
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-accounts
  namespace: accounts
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/eso-accounts
